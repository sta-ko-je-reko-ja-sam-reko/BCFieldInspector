<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 240px;
      padding: 16px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #333;
      background: #fafafa;
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 15px;
      color: #1b5e20;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .switch {
      position: relative;
      width: 40px;
      height: 22px;
    }
    .switch input { display: none; }
    .slider {
      position: absolute;
      inset: 0;
      background: #ccc;
      border-radius: 22px;
      cursor: pointer;
      transition: 0.2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.2s;
    }
    .switch input:checked + .slider { background: #2e7d32; }
    .switch input:checked + .slider::before { transform: translateX(18px); }
    button {
      width: 100%;
      padding: 8px;
      background: #1b5e20;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #2e7d32; }
    .hint {
      font-size: 11px;
      color: #777;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h2>BC Field Inspector</h2>

  <div class="toggle-row">
    <span>Show field names</span>
    <label class="switch">
      <input type="checkbox" id="toggleEnabled">
      <span class="slider"></span>
    </label>
  </div>

  <button id="refreshBtn">Refresh Fields</button>

  <div class="hint">Auto-detects Business Central pages (SaaS and on-premises). Shows the controlname attribute next to each field label.</div>

  <script src="popup.js"></script>
</body>
</html>
